<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#8B5CFF"/><stop offset="1" stop-color="#FF3D9A"/></linearGradient>
    <radialGradient id="o1" cx="15%" cy="20%" r="45%"><stop offset="0" stop-color="#00E5FF" stop-opacity=".28"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2" cx="88%" cy="90%" r="50%"><stop offset="0" stop-color="#8B5CFF" stop-opacity=".32"/><stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#78A0FF" stroke-opacity=".09"/></pattern>
    <clipPath id="c"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:Consolas,'SFMono-Regular',Menlo,monospace}
    .grid{animation:pan 8s linear infinite}
    @keyframes pan{to{transform:translate(40px,40px)}}
    .w{opacity:0;animation:cyc 12.5s infinite}
    .w2{animation-delay:2.5s}.w3{animation-delay:5s}.w4{animation-delay:7.5s}.w5{animation-delay:10s}
    @keyframes cyc{0%{opacity:0;transform:translateY(12px)}3%,17%{opacity:1;transform:none}20%,100%{opacity:0;transform:translateY(-12px)}}
    .cur{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .dot{animation:pu 1.6s ease-in-out infinite}
    @keyframes pu{50%{opacity:.25}}
    .pk{animation:mv 2.4s linear infinite}
    @keyframes mv{from{transform:translateX(0)}to{transform:translateX(260px)}}
    .node{animation:gl 2.4s ease-in-out infinite}
    @keyframes gl{50%{stroke:#00E5FF}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="320" fill="#05070D"/>
    <rect x="-40" y="-40" width="1280" height="400" fill="url(#grid)" class="grid"/>
    <rect width="1200" height="320" fill="url(#o1)"/>
    <rect width="1200" height="320" fill="url(#o2)"/>

    <g transform="translate(70 70)">
      <rect width="56" height="56" rx="14" fill="none" stroke="url(#g)" stroke-width="3"/>
      <path d="M17 18h22L17 38h22" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="146" y="113" class="t" font-size="40" font-weight="700" letter-spacing="5" fill="#E8EEFF">ZACEK <tspan fill="#00E5FF">LABS</tspan></text>

    <text x="294" y="186" text-anchor="end" class="t" font-size="44" font-weight="700" fill="#E8EEFF">Construyo</text>
    <g class="t" font-size="44" font-weight="700" fill="url(#g)">
      <text x="312" y="186" class="w">páginas web</text>
      <text x="312" y="186" class="w w2">tiendas en línea</text>
      <text x="312" y="186" class="w w3">plataformas</text>
      <text x="312" y="186" class="w w4">sistemas ERP</text>
      <text x="312" y="186" class="w w5">experiencias 3D</text>
    </g>
    <text x="70" y="232" class="t" font-size="20" fill="#8B97B8">Ingeniería de software a la medida para negocios de todo México</text>

    <g transform="translate(70 262)">
      <rect width="300" height="32" rx="16" fill="#39FF9E" fill-opacity=".07" stroke="#39FF9E" stroke-opacity=".35"/>
      <circle cx="20" cy="16" r="5" fill="#39FF9E" class="dot"/>
      <text x="36" y="21" class="m" font-size="14" fill="#39FF9E">Disponible para proyectos</text>
    </g>

    <!-- mini architecture -->
    <g transform="translate(790 70)">
      <rect x="0" y="0" width="340" height="196" rx="18" fill="#0A0F1C" stroke="#78A0FF" stroke-opacity=".18"/>
      <text x="20" y="32" class="m" font-size="13" fill="#5A6788">// tu-negocio.js</text>
      <text x="20" y="60" class="m" font-size="14" fill="#8B5CFF">const <tspan fill="#C8D3F5">sistema =</tspan> <tspan fill="#00E5FF">crear</tspan><tspan fill="#C8D3F5">({</tspan></text>
      <text x="40" y="84" class="m" font-size="14" fill="#C8D3F5">ventas: <tspan fill="#39FF9E">true</tspan>,</text>
      <text x="40" y="108" class="m" font-size="14" fill="#C8D3F5">reportes: <tspan fill="#39FF9E">"auto"</tspan>,</text>
      <text x="40" y="132" class="m" font-size="14" fill="#C8D3F5">whatsapp: <tspan fill="#39FF9E">true</tspan></text>
      <text x="20" y="156" class="m" font-size="14" fill="#C8D3F5">}); <tspan fill="#FF3D9A">deploy</tspan>()<tspan class="cur" fill="#00E5FF">▋</tspan></text>
      <line x1="40" y1="178" x2="300" y2="178" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>
      <circle cx="40" cy="178" r="4" fill="#00E5FF" class="pk"/>
      <circle cx="40" cy="178" r="4" fill="#8B5CFF" class="pk" style="animation-delay:-1.2s"/>
    </g>
    <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#78A0FF" stroke-opacity=".2" stroke-width="2"/>
  </g>
</svg>
